[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Nested contexts make fixture/model patch lifetimes explicit in these tests.
"tests/*.py" = ["SIM117"]
