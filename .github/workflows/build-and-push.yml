name: Build and push Docker image to ghcr.io

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: atrangigamer/atrangi-hr-ml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download embedding model weights into build context
        run: |
          pip install "huggingface_hub>=0.34,<2" --quiet
          python - <<'PYEOF'
          import os
          from huggingface_hub import snapshot_download
          # Must land inside the Docker build context (repo root)
          dest = os.path.join(os.environ["GITHUB_WORKSPACE"], "models", "embedding")
          snapshot_download(
              repo_id="sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2",
              local_dir=dest,
              ignore_patterns=["*.h5", "*.ot", "flax_model*", "tf_model*", "rust_model*"],
          )
          print(f"Downloaded to: {dest}")
          PYEOF
          ls -la models/embedding/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.free
          push: true
          tags: |
            ghcr.io/atrangigamer/atrangi-hr-ml:latest
            ghcr.io/atrangigamer/atrangi-hr-ml:${{ github.sha }}
