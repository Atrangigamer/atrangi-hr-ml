name: Build and push Docker image to ghcr.io

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: atrangigamer/atrangi-hr-ml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.free
          load: true
          push: false
          tags: |
            ghcr.io/atrangigamer/atrangi-hr-ml:latest
            ghcr.io/atrangigamer/atrangi-hr-ml:${{ github.sha }}

      - name: Verify real ONNX inference within 512 MiB
        run: |
          docker run --rm --memory=512m --memory-swap=512m ghcr.io/atrangigamer/atrangi-hr-ml:latest python -c "import importlib.util,math; assert importlib.util.find_spec('torch') is None; from app.embeddings import Embedder; m=Embedder('/models/embedding'); v=m.embed('Customer service and Excel'); assert len(v)==384 and abs(math.hypot(*v)-1)<1e-5"

      - name: Publish verified image
        run: |
          docker push ghcr.io/atrangigamer/atrangi-hr-ml:latest
          docker push ghcr.io/atrangigamer/atrangi-hr-ml:${{ github.sha }}
